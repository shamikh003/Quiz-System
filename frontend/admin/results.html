<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>QuizBoard | Reports</title>
    <script>
        (() => {
            const path = location.pathname, at = path.lastIndexOf('/admin/');
            const root = at >= 0 ? path.slice(0, at + 1) : path.replace(/\/(?:dashboard|addquestions|editquestions|managequestions|assignments|students|reports)\/?$/, '/');
            const base = document.createElement('base'); base.href = root + 'admin/'; document.head.append(base);
        })();
    </script>
    <script src="teacher-routing.js?v=1.1"></script>
    <link rel="icon" href="../favicon.ico?v=1">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=1">
    <link rel="manifest" href="../manifest-admin.json">
    <meta name="theme-color" content="#171293">
    <link rel="stylesheet" href="../style.css?v=8.2">
    <link rel="stylesheet" href="student-report.css?v=1.4">
</head>
<body class="app-shell-page blue-gold" data-teacher-page="reports">
<div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="shell-main">
<button type="button" class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle teacher navigation" aria-controls="sidebar" aria-expanded="false">&#9776;</button>

    <section class="results-page teacher-content">
        <div class="results-header">
            <h1 class="shell-page-title">Reports</h1>
        </div>
        <section class="school-panel grade-report-export" aria-labelledby="grade-reports-title">
            <h2 id="grade-reports-title">Grade Reports</h2>
            <div class="grade-report-fields">
                <div><label for="grade-report-grade">Grade</label><select id="grade-report-grade"><option value="">Choose grade</option><option value="4">Grade 4</option><option value="5">Grade 5</option><option value="6">Grade 6</option><option value="7">Grade 7</option><option value="0">Hifz</option></select></div>
                <div><label for="grade-report-section">Section</label><select id="grade-report-section" disabled><option value="">All Sections</option></select></div>
                <button type="button" id="grade-report-download" disabled>Download Grade PDF</button>
            </div>
            <p id="grade-report-status" role="status" aria-live="polite"></p>
        </section>
        <div class="report-view-tabs" role="tablist" aria-label="Report view">
            <button type="button" role="tab" id="all-results-tab" aria-controls="all-results-panel" aria-selected="true">All Results</button>
            <button type="button" role="tab" id="individual-report-tab" aria-controls="individual-report-panel" aria-selected="false" tabindex="-1">Student Report</button>
        </div>
        <section id="all-results-panel" role="tabpanel" aria-labelledby="all-results-tab" class="school-panel">
        <div class="report-filters"><div><label for="filter-grade">Grade</label>
        <select id="filter-grade">
            <option value="">All Grades</option>
            <option value="4">Grade 4</option>
            <option value="5">Grade 5</option>
            <option value="6">Grade 6</option>
            <option value="7">Grade 7</option>
            <option value="0">Hifz</option>
        </select>
        </div><div><label for="filter-section">Section</label><select id="filter-section"><option value="">All Sections</option></select></div>
        <div><label for="filter-roll">Roll number</label><input type="search" id="filter-roll" placeholder="Search roll number" maxlength="100"></div>
        <div><label for="filter-attempts">Attempts</label><select id="filter-attempts"><option value="all">All Attempts</option><option value="latest">Latest Attempt</option></select></div></div>
        <div class="report-toolbar results-summary-toolbar">
            <p id="results-count" role="status"></p>
            <div class="results-export-actions"><button id="export-pdf-btn" class="btn-secondary" disabled>Download PDF</button><button id="export-excel-btn" class="btn-secondary" disabled>Download Excel</button></div>
        </div>

        <div id="reports-loader" class="qb-loader-slot" hidden></div>
        <div class="report-table-wrap result-desktop-table"><table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Roll Number</th>
                    <th>Grade</th>
                    <th>Section</th>
                    <th>Quiz Score</th>
                    <th>Marks %</th>
                    <th>Time</th>
                    <th>Flags</th>
                    <th>Assignment %</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody id="results-body"></tbody>
        </table></div>
        <div id="report-result-cards" class="mobile-result-list" aria-label="Filtered quiz results"></div>

        <div class="top-bar results-actions" style="margin-top: 15px;">
            <button id="clear-results-btn" class="btn-danger hidden" style="width: auto;">Clear All Results</button>
        </div>

        <p class="error-text" id="results-note"></p>

        <div class="nav-links">
            <a href="index.html">Back to Admin Panel</a>
        </div>
        </section>
        <section id="individual-report-panel" role="tabpanel" aria-labelledby="individual-report-tab" class="individual-report" hidden>
            <section class="individual-search school-panel" aria-label="Find a student">
                <div class="individual-search-fields">
                    <div><label for="individual-name">Student name or roll number</label><input type="search" id="individual-name" placeholder="Search students" maxlength="100" autocomplete="off"></div>
                    <div><label for="individual-grade">Grade</label><select id="individual-grade"><option value="">All Grades</option><option value="4">Grade 4</option><option value="5">Grade 5</option><option value="6">Grade 6</option><option value="7">Grade 7</option><option value="0">Hifz</option></select></div>
                    <div><label for="individual-section">Section</label><select id="individual-section"><option value="">All Sections</option></select></div>
                </div>
                <p id="individual-search-status" role="status" aria-live="polite"></p>
                <button type="button" id="individual-search-retry" class="btn-secondary" hidden>Retry search</button>
                <div id="individual-search-results" class="individual-matches" aria-label="Matching students"></div>
            </section>
            <div id="individual-loader" class="qb-loader-slot" hidden></div>
            <p id="individual-message" role="status" aria-live="polite"></p>
            <section id="individual-content" hidden aria-label="Selected student's report">
                <header class="individual-profile school-panel">
                    <div class="individual-identity"><span class="individual-avatar" id="individual-initials" aria-hidden="true"></span><div><h2 id="individual-student-name"></h2><p id="individual-father-name"></p><p id="individual-student-meta"></p></div></div>
                    <div class="individual-download"><button type="button" id="individual-download-pdf">Download PDF</button><span id="individual-generated" class="individual-help"></span></div>
                </header>
                <div id="individual-metrics" class="individual-metrics"></div>
                <section class="school-panel individual-chart-panel"><div class="individual-section-heading"><h2 id="individual-chart-title">Quiz Performance</h2></div><div id="individual-chart"></div></section>
                <div class="individual-history-grid">
                    <section class="school-panel individual-history"><div class="individual-section-heading"><h2>Quiz History</h2><p id="individual-quiz-count"></p></div><div id="individual-quiz-history"></div><div class="individual-pagination"><button type="button" id="individual-quiz-prev" class="btn-secondary">Previous</button><span id="individual-quiz-page"></span><button type="button" id="individual-quiz-next" class="btn-secondary">Next</button></div></section>
                    <section class="school-panel individual-history"><div class="individual-section-heading"><h2>Assignment History</h2><p id="individual-assignment-count"></p></div><div id="individual-assignment-history"></div><div class="individual-pagination"><button type="button" id="individual-assignment-prev" class="btn-secondary">Previous</button><span id="individual-assignment-page"></span><button type="button" id="individual-assignment-next" class="btn-secondary">Next</button></div></section>
                </div>
            </section>
        </section>
    </section></main></div>
    <script src="../config.js?v=5.1"></script>
<script src="../loader.js?v=1.1"></script>
<script src="teacher-shell.js?v=1.4"></script>
<script src="report-utils.js?v=7.4"></script>
<script src="results.js?v=7.3"></script>
<script src="student-report.js?v=1.5"></script>

</body>
</html>
