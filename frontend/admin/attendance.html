<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuizBoard | Attendance</title>
<link rel="stylesheet" href="../style.css?v=8.11"><link rel="stylesheet" href="../clean-select.css?v=1.0"><link rel="stylesheet" href="attendance.css?v=3"><script src="../clean-select.js?v=1.0" defer></script></head>
<body class="app-shell-page blue-gold" data-teacher-page="attendance"><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="shell-main"><button type="button" class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
<section class="teacher-content attendance-page"><div class="shell-page-header"><div><h1 class="shell-page-title">Attendance</h1><p class="attendance-lead">Mark only students who were absent or present but could not attempt the quiz.</p></div></div>
<section class="school-panel attendance-register"><div class="attendance-filters"><label>Grade<select id="attendance-grade"><option value="">Choose grade</option><option value="4">Grade 4</option><option value="5">Grade 5</option><option value="6">Grade 6</option><option value="7">Grade 7</option><option value="0">Hifz</option></select></label><label>Section<select id="attendance-section" disabled><option value="">Choose section</option></select></label><label>Date<input id="attendance-date" type="date"></label><button id="attendance-load" type="button">Load Students</button></div>
<div class="attendance-key"><span><i class="dot attempted"></i>Attempted (automatic)</span><span><i class="dot missed"></i>Present – Not Attempted</span><span><i class="dot absent"></i>Absent</span></div><p id="attendance-message" role="status"></p><div id="attendance-list" class="attendance-list"><p class="shell-empty">Choose grade, section and date to load students.</p></div><div class="attendance-actions"><button id="attendance-save" disabled>Save Attendance</button></div></section></section>
</main></div><script src="../config.js?v=5.2"></script><script src="teacher-routing.js?v=1.2"></script><script src="teacher-shell.js?v=1.5"></script><script src="attendance.js?v=1.0"></script></body></html>
