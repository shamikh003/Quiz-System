<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>QuizBoard | Students</title>
<link rel="icon" href="../favicon.ico?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=1">
<link rel="icon" type="image/svg+xml" href="../favicon.svg?v=1">
<link rel="apple-touch-icon" sizes="180x180" href="../favicon-180.png?v=1">
<link rel="stylesheet" href="../style.css?v=7.4"></head>
<body class="app-shell-page blue-gold" data-teacher-page="students"><div class="app-shell">
<aside class="sidebar" id="sidebar"></aside><main class="shell-main">
<button type="button" class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle teacher navigation" aria-controls="sidebar" aria-expanded="false">&#9776;</button>
<section class="students-page teacher-content">
<h1 class="shell-page-title">Student Accounts</h1>
<p id="account-message" role="status" aria-live="polite"></p>
<div class="student-management-grid"><section class="school-panel registration-panel"><h2>Register Student</h2>
<form id="account-form">
<div class="field"><label for="account-name">Student name</label><input id="account-name" required maxlength="100"></div>
<div class="field-row"><div class="field"><label for="account-roll">Roll number</label><input id="account-roll" required maxlength="40"></div>
<div class="field"><label for="account-grade">Grade</label><select id="account-grade" required><option value="">Choose grade</option><option value="4">Grade 4</option><option value="5">Grade 5</option><option value="6">Grade 6</option><option value="7">Grade 7</option><option value="0">Hifz</option></select></div></div>
<div class="field-row"><div class="field"><label for="account-section">Section (optional)</label><input id="account-section" maxlength="80" placeholder="Enter section name" list="section-suggestions">
<datalist id="section-suggestions"></datalist>
</div>
<div class="field"><label for="account-password">Password (at least 6 characters)</label><input id="account-password" type="password" required minlength="6" maxlength="72" autocomplete="new-password"></div></div>
<button id="create-account" type="submit">Create Student Account</button></form>
</section><section class="school-panel registered-panel">
<h2>Registered Students</h2>
<div class="report-filters">
    <div><label for="student-filter-grade">Grade</label><select id="student-filter-grade"><option value="">All Grades</option><option value="4">Grade 4</option><option value="5">Grade 5</option><option value="6">Grade 6</option><option value="7">Grade 7</option><option value="0">Hifz</option></select></div>
    <div><label for="student-filter-section">Section</label><select id="student-filter-section"><option value="">All Sections</option></select></div>
    <div><label for="student-search">Name or roll number</label><input id="student-search" type="search" placeholder="Search students"></div>
</div>
<div class="report-toolbar"><p id="students-count" role="status"></p><button id="export-students-btn" type="button" class="btn-secondary" disabled>Export Filtered Students</button></div>
<div id="students-list" role="region" aria-label="Registered students" tabindex="0"></div>
</section></div></section></main></div><script src="../config.js?v=5.1"></script>
<script src="teacher-shell.js?v=1.0"></script>
<script src="report-utils.js?v=7.0"></script>
<script src="students.js?v=5.2"></script></body></html>
