<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Project</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>

    <div class="container">
        <button class="theme-toggle" id="theme-toggle">🌙 Dark</button>

        <div id="login-container">
            <h1>Welcome to the Quiz</h1>
            <form id="login-form">
                <label for="student-name">Enter Your Name:</label>
                <input type="text" id="student-name" required>

                <label for="student-roll">Enter Your Roll Number:</label>
                <input type="text" id="student-roll" required>

                <label for="student-grade">Select Your Grade:</label>
                <select id="student-grade" required>
                    <option value="" disabled selected>Choose grade</option>
                    <option value="4">Grade 4</option>
                    <option value="5">Grade 5</option>
                    <option value="6">Grade 6</option>
                    <option value="7">Grade 7</option>
                </select>

                <button type="submit">Start Quiz</button>
            </form>
        </div>

        <div id="loading-container">
            <h2>Loading Quiz...</h2>
            <p>Please wait, Quiz is starting</p>
        </div>

        <div id="quiz-container">
            <div id="timer-display">
                <span id="time-left">00:00</span>
            </div>

            <div class="progress-wrapper">
                <div class="progress-label">
                    <span id="progress-text">Question 1 of 1</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
                </div>
            </div>

            <h2 id="question-title"></h2>
            <div id="options-container"></div>
            <button id="next-btn" style="margin-top: 20px; display: none;">Next Question</button>
        </div>

        <div id="result-container">
            <h2 id="greeting-message" style="text-align: center;"></h2>
            <h2 id="score-display" style="text-align: center;"></h2>
            <h3 style="text-align: center; margin-top: 20px;">Your Detailed Results</h3>

            <div id="detailed-results-list"></div>

            <div class="nav-links">
                <a href="quiz.html">Take Quiz Again</a>
            </div>
        </div>
    </div>

    <script src="quiz.js?v=2.0"></script>

</body>
</html>
